; PlatformIO Project Configuration File
; Arduino Uno R3 (ATmega328P) - dual-servo solar tracker
;
; The sketch lives in SolarTracker/ so it also opens directly in the
; Arduino IDE (File > Open > SolarTracker/SolarTracker.ino).

[platformio]
src_dir = SolarTracker

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_deps =
    arduino-libraries/Servo
